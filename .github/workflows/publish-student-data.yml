name: Publish student library files
on:
  push:
    branches: [main]
    paths:
      - 'student-data/**'
      - '.github/workflows/publish-student-data.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: student-library-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: student-data
      - name: Publish PDF files and search indexes
        id: deployment
        uses: actions/deploy-pages@v4
