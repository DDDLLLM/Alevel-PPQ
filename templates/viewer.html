{% extends 'base.html' %}{% block content %}<div class="viewer-toolbar"><div><a href="/document/{{ doc.id }}">{{ doc.filename }}</a><p class="muted small">PDF 物理页码 · 第 {{ page }} / {{ doc.page_count }} 页</p></div><div class="actions">{% if page>1 %}<a class="button secondary" href="?page={{ page-1 }}">← 上一页</a>{% endif %}<form><label class="sr-only" for="viewer-page">PDF 页码</label><input id="viewer-page" name="page" type="number" min="1" max="{{ doc.page_count }}" value="{{ page }}"><button>跳转</button></form>{% if page<doc.page_count %}<a class="button secondary" href="?page={{ page+1 }}">下一页 →</a>{% endif %}<a class="button secondary" href="/pdf/{{ doc.id }}#page={{ page }}" target="_blank" rel="noopener">原 PDF ↗</a></div></div><div class="viewer-links">{% for r in related if r.kind=='ms' %}<a href="/pdf/{{ r.id }}" target="_blank" rel="noopener">打开本卷评分标准 {{ r.filename }} ↗</a>{% endfor %}</div><div class="pdf-page"><img src="/page/{{ doc.id }}/{{ page }}.png" alt="{{ doc.filename }} 的 PDF 第 {{ page }} 页"></div>{% endblock %}
